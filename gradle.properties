org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# pdfbox-android's older releases pull in a legacy com.android.support annotations
# artifact transitively; jetifier rewrites it to androidx so it doesn't clash with
# the rest of the (all-androidx) dependency graph. Safe no-op for any dependency
# that doesn't need it.
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official
