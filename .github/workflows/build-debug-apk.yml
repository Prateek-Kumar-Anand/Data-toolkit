name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          # ubuntu-latest already ships the Android SDK; use its sdkmanager directly.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --continue 2>&1 | tee build.log

      - name: Collect error list
        if: always()
        shell: bash
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed|AAPT|Unresolved|Manifest merger" build.log | head -300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|AAPT|Unresolved|Manifest merger" build.log > errors.txt || echo "No errors found" > errors.txt

      - name: Upload build log and error list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-errors
          path: |
            build.log
            errors.txt
            app/build/reports/**
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataToolkit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
