plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.prateek.datatoolkit'
    compileSdk 35

    defaultConfig {
        applicationId "com.prateek.datatoolkit"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            // Broadened beyond the original 5 entries: with ML Kit/Play Services, jsoup,
            // pdfbox-android, fastexcel and camera all on the classpath, plain LICENSE/NOTICE
            // excludes aren't enough - signature files and alternate license file names
            // collide too and fail the build with "More than one file was found with OS
            // independent path 'META-INF/...'" without these.
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/INDEX.LIST',
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.RSA'
            ]
        }
    }
}

configurations.all {
    resolutionStrategy {
        // Several dependencies below (ML Kit/Play Services, CameraX, Room, WorkManager)
        // transitively pull their own androidx.core/appcompat/material versions. Without
        // pinning, Gradle can resolve a mismatched combination whose merged resources are
        // missing entries the others expect (e.g. AAPT2 failing to find
        // style/TextAppearance.AppCompat.* during resource linking). Forcing one version
        // of each keeps the whole graph on the same, tested set.
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.appcompat:appcompat:1.7.0'
        force 'com.google.android.material:material:1.12.0'
    }
}

dependencies {
    // Core / UI
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Explicit (was previously only transitive via appcompat/fragment) - pins the
    // version that owns registerForActivityResult()/ActivityResultContracts used
    // by MainActivity, OcrActivity, PdfActivity, ExcelCsvActivity, BatchProcessingActivity.
    implementation 'androidx.activity:activity-ktx:1.9.2'

    // Lifecycle / coroutines
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Room (smart caching + processed-item history for the dashboard)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // WorkManager (batch processing + auto-retry)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // OCR - on-device ML Kit text recognition
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // PDF operations
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Web scraping (HTML parsing)
    implementation 'org.jsoup:jsoup:1.17.2'

    // Excel (xlsx) read/write - pure Java, no AWT, works on Android
    // 0.20.2: bumped from 0.17.0 to get real image-embedding support (Worksheet.addImage),
    // used by ExcelCsvHelper.writeXlsxWithImages() for the scraper's thumbnail export.
    implementation 'org.dhatim:fastexcel:0.20.2'
    implementation 'org.dhatim:fastexcel-reader:0.20.2'
    // StAX engine fastexcel-reader actually parses sheet XML with. Pinned as an explicit,
    // direct dependency (rather than left as transitive-only) because ToolkitApp.onCreate()
    // forces javax.xml.stream.XMLInputFactory to resolve to this exact class - see the
    // comment there for why (fixes the app-wide crash on opening any .xlsx file).
    implementation 'com.fasterxml:aalto-xml:1.3.2'

    // Charts for the analytics dashboard
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
